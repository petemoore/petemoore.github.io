<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="SAM Coupé meets aarch64 — retro CRT style banner">
  <defs>
    <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141a"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="3" width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="220" rx="14" fill="url(#crt)"/>
  <rect width="800" height="220" rx="14" fill="url(#scan)"/>
  <rect x="2" y="2" width="796" height="216" rx="12" fill="none" stroke="#2a3340" stroke-width="2"/>
  <!-- SAM-style accent stripes -->
  <g>
    <rect x="40" y="38" width="10" height="144" fill="#d23b32"/>
    <rect x="56" y="38" width="6"  height="144" fill="#e8e4da"/>
    <rect x="66" y="38" width="3"  height="144" fill="#3b6ea5"/>
  </g>
  <g font-family="'Courier New', Courier, monospace">
    <text x="100" y="84"  font-size="40" fill="#7ce38b" font-weight="bold">SAM Coupé ⇄ aarch64</text>
    <text x="100" y="120" font-size="17" fill="#9fb0c0">6 MHz Z80 · 1989 · binaries byte-identical to GNU binutils</text>
    <text x="100" y="148" font-size="17" fill="#9fb0c0">ZX0 decode @ 52 T-states/byte · comments in 0.285× the space</text>
    <text x="100" y="186" font-size="15" fill="#5d6b7a">&gt; process as scar tissue, not ceremony_</text>
  </g>
</svg>
